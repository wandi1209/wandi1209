<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="560" viewBox="0 0 1000 560" role="img" aria-labelledby="title desc">
  <title id="title">Wandi — software engineer, web and mobile</title>
  <desc id="desc">Software Engineer building web and mobile systems. Backend: Go, Laravel, REST APIs, PostgreSQL. Mobile: Flutter, Dart, clean architecture. Frontend: React, Next.js, Tailwind CSS. Now: Software Engineer at Beinsoft; D-IV Informatics Engineering at Politeknik Negeri Malang; Head of Frontend Development Division at Workshop Riset Informatika.</desc>

  <defs>
    <style>
      .display { font-family: 'Space Grotesk', 'Helvetica Neue', Arial, sans-serif; }
      .label { font-family: 'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace; }
      .cream { fill: #EAE5DF; }
      .soft { fill: #B8B2AA; }
      .muted { fill: #8A857E; }
      .gold { fill: #FACC15; }
    </style>
  </defs>

  <rect x="0.5" y="0.5" width="999" height="559" rx="20" fill="#1B1B1B" stroke="#2E2C29" />

  <!-- Eyebrow -->
  <rect x="56" y="66" width="7" height="7" rx="1.5" class="gold" />
  <text x="76" y="74" class="label gold" font-size="11" letter-spacing="3.4">PROFILE</text>
  <text x="944" y="74" text-anchor="end" class="label muted" font-size="11" letter-spacing="2.6">MALANG, ID · UTC+7</text>

  <!-- Statement -->
  <text x="56" y="158" class="display cream" font-size="46" font-weight="700" letter-spacing="-1.4">Software Engineer</text>
  <text x="56" y="208" class="display cream" font-size="46" font-weight="700" letter-spacing="-1.4">building web &amp; mobile systems.</text>

  <line x1="56" y1="248" x2="944" y2="248" stroke="#2E2C29" />

  <!-- Focus columns -->
  <text x="56" y="290" class="label muted" font-size="10.5" letter-spacing="2.8">BACKEND</text>
  <text x="56" y="322" class="display cream" font-size="18">Go · Laravel</text>
  <text x="56" y="348" class="display soft" font-size="18">REST · PostgreSQL</text>

  <text x="372" y="290" class="label muted" font-size="10.5" letter-spacing="2.8">MOBILE</text>
  <text x="372" y="322" class="display cream" font-size="18">Flutter · Dart</text>
  <text x="372" y="348" class="display soft" font-size="18">Clean architecture</text>

  <text x="688" y="290" class="label muted" font-size="10.5" letter-spacing="2.8">FRONTEND</text>
  <text x="688" y="322" class="display cream" font-size="18">React · Next.js</text>
  <text x="688" y="348" class="display soft" font-size="18">Tailwind CSS</text>

  <line x1="56" y1="392" x2="944" y2="392" stroke="#2E2C29" />

  <!-- Now -->
  <text x="56" y="432" class="label gold" font-size="10.5" letter-spacing="2.8">NOW</text>

  <text x="56" y="468" class="display cream" font-size="16">Software Engineer</text>
  <text x="400" y="468" class="display muted" font-size="16">Beinsoft</text>

  <text x="56" y="500" class="display cream" font-size="16">D-IV Informatics Engineering</text>
  <text x="400" y="500" class="display muted" font-size="16">Politeknik Negeri Malang</text>

  <text x="56" y="532" class="display cream" font-size="16">Head of Frontend Development</text>
