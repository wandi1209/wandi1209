<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="430" viewBox="0 0 1000 430" role="img" aria-labelledby="title desc">
  <title id="title">wandi@malang — whoami</title>
  <desc id="desc">Terminal card: software engineer, web and mobile. Focus: Go, Laravel, REST APIs, PostgreSQL; Flutter, Dart, clean architecture; React, Next.js, Tailwind CSS. Now: Software Engineer at Beinsoft, D-IV Informatics Engineering at Politeknik Negeri Malang, Head of Frontend Development Division at Workshop Riset Informatika.</desc>

  <defs>
    <style>
      .bar { fill: #232220; }
      .shell { fill: #EAE5DF; }
      .muted { fill: #8A857E; }
      .gold { fill: #FACC15; }
      .mono { font-family: 'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace; }
    </style>
  </defs>

  <!-- Canvas -->
  <rect x="0.5" y="0.5" width="999" height="429" rx="16" fill="#1B1B1B" stroke="#2E2C29" />

  <!-- Title bar -->
  <path d="M0.5 16.5a16 16 0 0 1 16-16h967a16 16 0 0 1 16 16V46.5H0.5z" fill="#232220" />
  <circle cx="32" cy="24" r="4.5" class="gold" />
  <circle cx="50" cy="24" r="4.5" fill="#EAE5DF" opacity="0.28" />
  <circle cx="68" cy="24" r="4.5" fill="#EAE5DF" opacity="0.14" />
  <text x="500" y="28" text-anchor="middle" class="mono muted" font-size="11" letter-spacing="1.6">wandi@malang — zsh</text>
  <line x1="0.5" y1="46.5" x2="999.5" y2="46.5" stroke="#2E2C29" />

  <!-- whoami -->
  <text x="40" y="98" class="mono" font-size="15">
    <tspan class="gold">wandi@malang</tspan><tspan class="muted"> ~ % </tspan><tspan class="shell">whoami</tspan>
  </text>
  <text x="40" y="126" class="mono" font-size="15">
    <tspan class="shell">software engineer</tspan><tspan class="gold"> · </tspan><tspan class="shell">web &amp; mobile</tspan>
  </text>

  <!-- focus -->
  <text x="40" y="172" class="mono" font-size="15">
    <tspan class="gold">wandi@malang</tspan><tspan class="muted"> ~ % </tspan><tspan class="shell">cat focus.txt</tspan>
  </text>
  <text x="40" y="200" class="mono" font-size="15">
    <tspan class="muted">backend</tspan><tspan x="150" class="gold">→</tspan><tspan x="182" class="shell">Go, Laravel, REST APIs, PostgreSQL</tspan>
  </text>
  <text x="40" y="226" class="mono" font-size="15">
    <tspan class="muted">mobile</tspan><tspan x="150" class="gold">→</tspan><tspan x="182" class="shell">Flutter, Dart, clean architecture</tspan>
  </text>
  <text x="40" y="252" class="mono" font-size="15">
    <tspan class="muted">frontend</tspan><tspan x="150" class="gold">→</tspan><tspan x="182" class="shell">React, Next.js, Tailwind CSS</tspan>
  </text>

  <!-- now -->
  <text x="40" y="298" class="mono" font-size="15">
    <tspan class="gold">wandi@malang</tspan><tspan class="muted"> ~ % </tspan><tspan class="shell">ls now/</tspan>
  </text>
  <text x="40" y="326" class="mono" font-size="15">
    <tspan class="gold">beinsoft/</tspan><tspan x="250" class="shell">software engineer</tspan>
  </text>
  <text x="40" y="352" class="mono" font-size="15">
    <tspan class="gold">polinema/</tspan><tspan x="250" class="shell">d-iv informatics engineering</tspan>
  </text>
  <text x="40" y="378" class="mono" font-size="15">
    <tspan class="gold">workshop-riset/</tspan><tspan x="250" class="shell">head of frontend development division</tspan>
  </text>

  <!-- Cursor -->
  <rect x="40" y="394" width="9" height="16" class="gold" opacity="0.85">
    <animate attributeName="opacity" values="0.85;0.85;0;0;0.85" dur="1.2s" repeatCount="indefinite" />
  </rect>
</svg>